name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
          run_install: false
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python3 -m pip install -r services/video-template/requirements.txt -r services/video-production/requirements.txt
      - run: npm test
      - run: npm run build:web
      - run: python3 -m unittest discover -s services/crawler -p 'test_*.py'
      - run: node scripts/check-main-flow.mjs
