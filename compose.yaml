services:
  app:
    build: .
    restart: unless-stopped
    environment:
      ORYNT_PUBLIC_ORIGIN: https://${ORYNT_DOMAIN:?Set ORYNT_DOMAIN in .env}
      ORYNT_ACCESS_USER: ${ORYNT_ACCESS_USER:-demo}
      ORYNT_ACCESS_PASSWORD: ${ORYNT_ACCESS_PASSWORD:?Set a unique access password in .env}
      ORYNT_DEMO_ONLY: "1"
    volumes:
      - orynt_data:/data
    expose:
      - "3000"
    init: true
    stop_grace_period: 30s
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      ORYNT_DOMAIN: ${ORYNT_DOMAIN:?Set ORYNT_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  orynt_data:
  caddy_data:
  caddy_config:
